<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>致盛汽車</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif;color:#17191d;background:#f5f6f8}
button,input,select,textarea{font:inherit}.a{max-width:720px;margin:auto;min-height:100vh;background:#fff}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eee;padding:10px;display:flex;align-items:center;gap:9px}
.brand{width:180px;height:58px;object-fit:contain}.m{font-size:13px;color:#737984}main{padding:14px 14px 100px}
.c{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:11px}.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.b{border:0;border-radius:10px;padding:9px 11px;background:#17191d;color:#fff;font-weight:800}
.o{background:#f58220}.x{background:#fff;color:#222;border:1px solid #ddd}.d{background:#fff0f0;color:#a22;border:1px solid #fdd}.p{background:#fff7ef;color:#b75b00;border:1px solid #ffd7b1}
.it{padding:11px 0;border-bottom:1px solid #eee}.ac{display:flex;gap:5px;flex-wrap:wrap}.ac button{font-size:12px;padding:6px 8px}
.q button{border:0;border-radius:14px;padding:17px 5px;font-weight:800}.q1{background:#eaf1ff;color:#245fc2}.q2{background:#e9f8ef;color:#168a50}.q3{background:#fff0e3;color:#cf6600}.q4{background:#f2ebff;color:#7145bd}
.nav{position:fixed;font-size:11px;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:1px solid #ddd;padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:8}
.nav button{border:0;background:none;color:#777}.nav .on{color:#f58220;font-weight:900}.nav span{display:block;font-size:20px}
.mo{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sh{width:min(720px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom))}
.f{margin:9px 0}.f label{display:block;font-size:12px;color:#666;margin-bottom:4px}.f input,.f select,.f textarea{width:100%;padding:11px;border:1px solid #d7dae0;border-radius:11px;background:#fff}
.ln{border:1px solid #ddd;border-radius:12px;padding:9px;margin:8px 0;background:#fafafa}.ad{width:100%;padding:10px;border:1px dashed #aaa;background:#fff;border-radius:11px;font-weight:800}
.sv{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:14px}.tb{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}.tb button{padding:10px;border:1px solid #ddd;background:#fff;border-radius:10px;font-weight:800}.tb .on{background:#17191d;color:#fff}
.bd{display:inline-block;background:#f2f3f5;padding:4px 8px;border-radius:99px;font-size:12px;margin:2px}.vc{border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:8px 0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#191b1f}.box{width:min(420px,100%);background:#fff;padding:22px;border-radius:22px;text-align:center}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 13px;border-radius:99px;display:none;z-index:30}
.brandlock{display:flex;align-items:center;gap:10px}.brandlogo{width:72px;height:72px;object-fit:contain}.wordmark{width:190px;max-height:58px;object-fit:contain}
.login .brandlock{justify-content:center;flex-direction:column}.login .brandlogo{width:150px;height:120px}.login .wordmark{width:240px;max-height:70px}
.top .brandlogo{width:59px!important;height:auto!important}.top .wordmark{width:167px!important;max-height:66px!important}
.it>.r{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;align-items:center!important}.it>.r>div:first-child{min-width:0}
.it .ac{display:grid!important;grid-auto-flow:column!important;grid-auto-columns:max-content!important;gap:5px!important;flex-wrap:nowrap!important;white-space:nowrap!important}
.it .ac button{font-size:11px!important;padding:7px 7px!important;white-space:nowrap!important}
.costHint{font-size:11px;color:#777;margin-top:4px}
.itemRow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.itemRow2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.itemRow3 .f,.itemRow2 .f{min-width:0}
.internalCostBox{margin-top:9px;padding:9px;border:1px dashed #d9b28f;border-radius:10px;background:#fff8f1;color:#7d4b20}
.internalCostBox .r{padding:2px 0}
.home-period{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.home-period .b{flex:0 0 auto}
@media(max-width:600px){
  .it>.r{
    grid-template-columns:minmax(0,1fr)!important;
    align-items:start!important
  }

  .it .ac{
    width:100%!important;
    display:grid!important;
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    grid-auto-flow:row!important;
    grid-auto-columns:unset!important;
    gap:6px!important;
    margin-top:9px!important;
    white-space:normal!important
  }

  .it .ac button{
    width:100%!important;
    min-width:0!important;
    padding:8px 6px!important;
    white-space:nowrap!important
  }
}
@media(max-width:390px){.itemRow3{gap:5px}.itemRow3 .f input,.itemRow2 .f input{padding:10px 7px}}
</style>
</head>
<body>
<div id="R"></div><div id="M"></div><div id="T" class="toast"></div>

<!-- 已驗收基準資產 -->
<script src="https://zhisheng-clean-pdf-preview.vercel.app/coreA.js"></script>
<script src="https://zhisheng-clean-pdf-preview.vercel.app/coreB.js"></script>
<script src="https://zhisheng-pdf-share-preview.vercel.app/rest.js"></script>
<script src="https://zhisheng-phase3-upgrade-final.vercel.app/upgrade.js"></script>
<script src="https://zhisheng-phase3-inputfix.vercel.app/layout-cost-v2.js"></script>

<!-- 最後定版修正 -->
<script src="./final-home.js"></script>
<script src="./quote-enhance.js"></script>
<script src="./repair-workflow.js"></script>
<script>
(function(){
  document.addEventListener('focusin',function(e){
    const el=e.target;

    if(
      el.matches &&
      el.matches('input[type="number"]') &&
      el.value==='0'
    ){
      el.value='';
    }
  });

  document.addEventListener('focusout',function(e){
    const el=e.target;

    if(
      el.matches &&
      el.matches('input[type="number"]') &&
      el.value===''
    ){
      el.value='0';
      el.dispatchEvent(new Event('input',{bubbles:true}));
      el.dispatchEvent(new Event('change',{bubbles:true}));
    }
  });
})();
</script>
</body>
</html>
